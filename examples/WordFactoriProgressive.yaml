name: WordFactoriProgressive
description: Optional progressive machines, recipes and three chosen word orders
game: Word Factori
requires:
  version: 0.6.7
Word Factori:
  progressive_machines: true
  accessibility: full
  custom_level_set: discovery_labs
  goal: campaign_count
  campaign_count: 25
  recipe_checks: true
  type_a_word_checks: true
  type_a_word_count: 3
  type_a_word_words: ['JACK', 'FACTORY', 'PUZZLE', 'ISLAND', 'I=']
  # The room chooses three; AP Mail > Type-a-Word lists the selected targets.
  # Optional: move extra starting upgrades out of the item pool.
  # start_inventory_from_pool:
  #   Progressive Rotation Access: 1
